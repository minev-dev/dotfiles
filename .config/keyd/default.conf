[ids]
*

[main]
# Linux keyd remaps (left-side thumb as layer switch).
# Keep the existing layer behavior while making intent and scope explicit.

# Layer selection.
leftmeta = layer(mac_cmd)    # Windows key -> mac-style modifiers (universal Mac layer).
leftcontrol = layer(control) # Pinky key -> control layer (keeps shell Ctrl combos intact).
leftalt = layer(alt)        # Alt key -> Alt layer (fallback/legacy mappings).

[mac_cmd:A]
# mac_cmd layer
# Active while holding the thumb switch; maps to app-friendly shortcuts.

# Mouse and tab actions
# Open link in new tab.
leftmouse = C-leftmouse
# Close tab.
w = C-f4
# New tab.
t = C-t

# Clipboard
# Copy.
c = C-insert
# Paste.
v = S-insert

# General Ctrl-style shortcuts
a = C-a
b = C-b
d = C-d
e = C-e
f = C-f
g = C-g
h = C-h
i = C-i
j = C-j
k = C-k
l = C-l
m = C-m
n = C-n
o = C-o
p = C-p
q = C-q
r = C-r
s = C-s
u = C-u
x = C-x
y = C-y
z = C-z

# Numbered shortcuts (tab / window controls)
1 = C-1
2 = C-2
3 = C-3
4 = C-4
5 = C-5
6 = C-6
7 = C-7
8 = C-8
9 = C-9
0 = C-0
