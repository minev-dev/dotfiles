# Terminal clipboard contract (Ghostty + tmux + lazygit)
# - Clipboard uses OSC52 via terminal/terminal app, and tmux must stay passthrough-friendly.
# - Keep OSC52 assumptions here; avoid adding platform-specific helpers (xclip/pbcopy).
set -s set-clipboard on
set -g allow-passthrough on
set -g focus-events on

# Use Vim-style selection behavior in tmux copy mode.
setw -g mode-keys vi

# Keep this near-zero for responsive modal and escape-driven workflows.
set -s escape-time 0
